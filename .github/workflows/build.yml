# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Builds the headless fc-remoteplay sidecar. Much lighter than chiaki-ng's own
# CI because we build ONLY the core lib (no Qt/Vulkan/SDL/ffmpeg).
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    env:
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/build/vcpkg_installed
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Ninja
        run: choco install ninja

      # chiaki-ng calls the FindPythonInterp module and its vendored libs
      # declare cmake_minimum_required < 3.5 — both removed/rejected by CMake
      # 4.x (the default on current runners). Pin to the last 3.x.
      # Installed from PyPI: the setup-cmake action downloads via
      # api.github.com, which has been flaky enough to kill whole runs.
      - name: Pin CMake 3.31
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/cmake-venv"
          "$RUNNER_TEMP/cmake-venv/Scripts/pip" install cmake==3.31.6
          echo "$RUNNER_TEMP/cmake-venv/Scripts" >> "$GITHUB_PATH"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # chiaki's C sources use C99 VLAs (ctrl.c, rudp.c, regist.c, session.c,
      # holepunch.c), which MSVC's cl will never support. clang-cl is
      # MSVC-ABI-compatible, uses the MSVC headers/libs set up above, and
      # accepts VLAs — upstream chiaki-ng never builds with cl either.
      - name: Ensure clang-cl
        shell: bash
        run: |
          clang-cl --version || choco install -y llvm
          echo 'C:\Program Files\LLVM\bin' >> "$GITHUB_PATH"

      - name: Python deps for nanopb codegen
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade protobuf grpcio-tools

      # Cache vcpkg-built deps (openssl/protobuf/etc — ~30 min from scratch) in
      # the Actions cache. Only enabled when the runtime cache env is present so
      # a missing token can never fail the install.
      - name: Enable vcpkg GHA binary cache
        uses: actions/github-script@v7
        with:
          script: |
            const keys = ['ACTIONS_CACHE_URL', 'ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN'].filter(k => process.env[k]);
            for (const k of keys) core.exportVariable(k, process.env[k]);
            if (keys.includes('ACTIONS_RUNTIME_TOKEN'))
              core.exportVariable('VCPKG_BINARY_SOURCES', 'clear;x-gha,readwrite');

      # bash so $VCPKG_INSTALLATION_ROOT expands reliably (PowerShell folded it
      # into a literal). CMAKE_POLICY_VERSION_MINIMUM=3.5 lets chiaki's vendored
      # libs + libwebsockets (which declare cmake_minimum_required < 3.5)
      # configure under any CMake version.
      - name: Configure (vcpkg manifest supplies openssl/opus/json-c/libevent/miniupnpc/protobuf)
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_C_COMPILER=clang-cl \
            -DCMAKE_CXX_COMPILER=clang-cl \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Stage
        shell: bash
        run: |
          mkdir -p dist/win
          cp build/fc-remoteplay.exe dist/win/
          # bundle the vcpkg runtime DLLs the exe links against
          cp build/vcpkg_installed/x64-windows/bin/*.dll dist/win/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: fc-remoteplay-win-x64
          path: dist/win/

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build deps
        run: |
          brew install ninja pkg-config openssl@3 opus json-c libevent miniupnpc protobuf
          python3 -m pip install --break-system-packages --upgrade protobuf grpcio-tools

      # See Windows job — pin CMake < 4.x for chiaki-ng compatibility,
      # installed from PyPI to avoid the flaky api.github.com download.
      - name: Pin CMake 3.31
        run: |
          python3 -m venv "$RUNNER_TEMP/cmake-venv"
          "$RUNNER_TEMP/cmake-venv/bin/pip" install cmake==3.31.6
          echo "$RUNNER_TEMP/cmake-venv/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)

      - name: Build
        run: cmake --build build --parallel

      - name: Stage
        run: |
          mkdir -p dist/mac
          cp build/fc-remoteplay dist/mac/

      # Gatekeeper kills unsigned spawned binaries inside a signed .app.
      # Enable once signing secrets exist:
      # - name: Codesign
      #   run: codesign --force --options runtime --timestamp --sign "$DEVELOPER_ID" dist/mac/fc-remoteplay

      - uses: actions/upload-artifact@v4
        with:
          name: fc-remoteplay-mac-arm64
          path: dist/mac/
