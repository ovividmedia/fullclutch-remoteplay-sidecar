# SPDX-License-Identifier: AGPL-3.0-or-later
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build deps (protobuf, openssl, opus) via vcpkg
        run: |
          vcpkg install openssl:x64-windows-static opus:x64-windows-static protobuf:x64-windows-static
        shell: bash

      - name: Configure
        run: >
          cmake -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DCMAKE_BUILD_TYPE=Release
        shell: bash

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Stage
        run: |
          mkdir -p dist/win
          cp build/Release/fc-remoteplay.exe dist/win/
        shell: bash

      # Optional: sign the binary if a cert is configured (secrets.WIN_CERT_*)
      # - name: Sign
      #   run: signtool sign /f cert.pfx /p ${{ secrets.WIN_CERT_PW }} dist/win/fc-remoteplay.exe

      - uses: actions/upload-artifact@v4
        with:
          name: fc-remoteplay-win-x64
          path: dist/win/

  macos:
    runs-on: macos-14  # arm64 runner
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build deps
        run: brew install openssl@3 opus protobuf cmake

      - name: Configure (universal)
        run: >
          cmake -B build
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_BUILD_TYPE=Release
          -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)

      - name: Build
        run: cmake --build build --parallel

      - name: Stage
        run: |
          mkdir -p dist/mac
          cp build/fc-remoteplay dist/mac/

      # Gatekeeper will kill an unsigned spawned binary inside the .app. Sign +
      # notarize here once signing secrets are configured.
      # - name: Codesign + notarize
      #   run: |
      #     codesign --force --options runtime --timestamp \
      #       --sign "$DEVELOPER_ID" dist/mac/fc-remoteplay

      - uses: actions/upload-artifact@v4
        with:
          name: fc-remoteplay-mac-universal
          path: dist/mac/
